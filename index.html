<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گەشتەکەت</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            background-color: #0d0d0d;
            overflow: hidden;
            position: relative;
        }

        /* شاشەی سەرەتایی شیک و درەوشاوە */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(20, 20, 25, 0.96) 0%, rgba(5, 5, 8, 0.98) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
        }

        /* ئەنیمەیشنی دڵە درەوشاوەکە */
        .heart-trigger {
            position: relative;
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .heart-icon {
            font-size: 55px;
            color: #ff4b72;
            text-shadow: 0 0 20px rgba(255, 75, 114, 0.6), 0 0 40px rgba(255, 75, 114, 0.3);
            animation: pulse 1.8s infinite ease-in-out;
            user-select: none;
        }

        .pulse-ring {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(255, 75, 114, 0.5);
            animation: ripple 2s infinite ease-out;
        }

        #start-screen h2 {
            color: #f0f0f0;
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 0 20px;
            opacity: 0.9;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.85; }
            50% { transform: scale(1.12); opacity: 1; text-shadow: 0
